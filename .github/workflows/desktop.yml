name: desktop
# Builds the optional Tauri app. Does not run on normal pushes, so the test CI stays fast.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Icons
        working-directory: desktop/src-tauri
        run: cargo tauri icon ../../sunak/static/icon.svg
      - name: Build
        working-directory: desktop/src-tauri
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: sunak-desktop-${{ matrix.os }}
          path: desktop/src-tauri/target/release/bundle/**/*
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
