# docker compose up -d   ->   http://localhost:7000
services:
  sunak:
    build: .
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-7000}:7000"
    volumes:
      - ./data:/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - SUNAK_PASSWORD=${SUNAK_PASSWORD:-}
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./data/ollama:/root/.ollama
    restart: unless-stopped
